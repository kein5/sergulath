name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests and install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The tools target Windows; Linux keeps the parts that do not need it honest.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests (no SteamVR, no headset)
        run: python -m unittest discover -s tests -t . -v
      - name: Install the package and run the command line
        run: |
          python -m pip install --disable-pip-version-check .
          sergulath --version
          sergulath profiles --format json
      # The virtual controller driver (a SteamVR driver DLL, no dependencies). Only Windows loads it;
      # Linux keeps the protocol and layout tests compiling.
      - name: Driver tests and build
        run: |
          cargo test --manifest-path driver/Cargo.toml --locked
          cargo build --manifest-path driver/Cargo.toml --release --lib --locked
