# ASTAROT (kein5/astarot). Facts the tools need about the app, per app version.

name = "ASTAROT"

[app]
process = "astarot.exe"  # 0.7.0 and later
legacy_process = ["vrct-vox.exe"]  # 0.6.x and earlier
exe = "%LOCALAPPDATA%\\ASTAROT\\astarot.exe"  # the default install folder (0.5.1 and later)
main_window_title = "ASTAROT"
# The app's log (UTC times), for `sergulath logs`.
log = "%LOCALAPPDATA%\\ASTAROT\\logs\\process.log"

# Settings for an app the tools start with a settings folder of its own (`sergulath app start
# --settings-dir DIR --fresh`): no first-run setup, no telemetry question, nothing sent to VRChat
# (and no firewall question for OSC), Japanese UI (the [ui.ja] names), both caption overlays on.
[app.check_settings]
FIRST_RUN_SETUP_PENDING = false
TELEMETRY_NOTICE = 1
ENABLE_TELEMETRY = false
AUTO_DOWNLOAD_MODELS = false
OSC_IP_ADDRESS = "127.0.0.2"
SEND_MESSAGE_TO_VRC = false
VRC_MIC_MUTE_SYNC = false
WEBSOCKET_SERVER = false
UI_LANGUAGE = "ja"
OVERLAY_SMALL_LOG = true
OVERLAY_LARGE_LOG = true

# Which overlay shows which caption.
[captions]
one = "ASTAROT0"
multi = "ASTAROT1"

# Accessible names of the buttons on the way to the caption sample, in the app's Japanese UI
# (locales/ja.yml). The sample is sent once a second while the settings page stays open.
[ui.ja]
open_settings = "設定を開く"                     # main page, gear button
page = "字幕とVR"                                # settings rail
details_prefix = "詳細設定"                      # the page's "more settings" fold (name starts with this)
tab_one = "一行"
tab_multi = "複数行"
sample_start = "サンプルの文を字幕オーバーレイに送る"
sample_stop = "送信を停止"
back = "戻る"

# Overlay keys, in the app's order (native/vr-overlay, Surface::ALL).
# 0.6 and later: ASTAROT0..4. Up to 0.5.x the keys were VRCT0..4.
[overlays]
ASTAROT0 = "caption, one line (head)"
ASTAROT1 = "caption, multiple lines (hand)"
ASTAROT2 = "VR panel"
ASTAROT3 = "launcher"
ASTAROT4 = "popup"

[legacy_overlays]
VRCT0 = "caption, one line (head), up to 0.5.x"
VRCT1 = "caption, multiple lines (hand), up to 0.5.x"
VRCT2 = "VR panel, up to 0.5.x"
VRCT3 = "launcher, up to 0.5.x"
VRCT4 = "popup, up to 0.5.x"

# The VR UI's laser (native/vr-overlay/src/pose.rs, LASER_PITCH_UP_DEG): it leaves the controller's
# tip, tilted up by this much. A controller without a render model (SERGULATH's) has its tip at
# its body.
[laser]
pitch_up_deg = 12.0

# Spots on the VR UI, as (u, v): 0..1 from the left and the top of what the overlay shows.
# Measured on 0.6.0-beta.2 from the VR page's layout (launcher region 880x128 at the page's
# (10, 708), buttons 112x104 CSS px); a later version may move them.
[buttons.ASTAROT3]
translation = [0.077, 0.5]
microphone = [0.214, 0.5]
listen = [0.350, 0.5]
ocr = [0.486, 0.5]
log = [0.580, 0.5]
language = [0.716, 0.5]
inputs_outputs = [0.852, 0.5]
vr_settings = [0.989, 0.5]  # the button runs past the launcher's region on 0.6.0-beta.2

# Update channels and Windows install metadata, for `sergulath upgrade`.
[upgrade]
base_version = "0.6.0"
repository = "kein5/astarot"
package_asset = "ASTAROT.zip"  # 0.7.0 and later
legacy_package_assets = ["VRCT-VOX.zip"]  # 0.6.x and earlier
installer_asset = "ASTAROT_setup.exe"
stable_manifest = "https://vrct-vox-updates.kei9d09.workers.dev/latest.json"
beta_manifest = "https://vrct-vox-updates.kei9d09.workers.dev/beta/latest.json"
models_dir = "downloaded_models"
# HKCU registry keys written by the NSIS installer (snapshotted and restored around installer runs).
registry_keys = [
    "Software\\kein5\\ASTAROT",
    "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\ASTAROT",
    "Software\\kein5\\VRCT-VOX",
    "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\VRCT-VOX",
]

# Non-default, schema-valid settings seeded before an upgrade and verified before and after launch.
[upgrade.sentinel_settings]
SELECTED_RELEASE_CHANNEL = "beta"
RELEASE_CHANNEL_CHOSEN = true
TRANSPARENCY = 87
MIC_THRESHOLD = 456
