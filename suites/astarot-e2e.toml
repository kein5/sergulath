# ASTAROT end-to-end cases (26): E01..E24 from the 2026-11-23 list, plus E25 (30-minute soak)
# and E26 (0.6.0 -> beta / local package upgrade). Run:
#
#     sergulath suite run --cases suites/astarot-e2e.toml --record records/suite/run
#     sergulath suite run --cases suites/astarot-e2e.toml --slow     # also E18, E21, E25 (about 60 min)
#     SERGULATH_UPGRADE_TO=path/to/ASTAROT.zip sergulath suite run --cases suites/astarot-e2e.toml --only E26
#
# What it needs: SteamVR with the headset connected (a Steam Frame lying on a desk is fine),
# the installed ASTAROT 0.7.0-beta.3 or later (E11, E14 and E15 close its settings window), the virtual controller driver built (`sergulath driver
# build`), and for E20 and E23 SSH to the Frame (`sergulath frame`).
#
# What it changes, all put back by the teardowns, also after a failure:
# - The installed ASTAROT is stopped for the run; the cases run their own ASTAROT with a settings
#   folder of its own under records/suite/ (ground rule 4: the user's settings are never touched),
#   and the installed one is started again at the end.
# - E01 stops SteamVR and starts it again through Steam.
# - The "virtual" phase switches SteamVR to the virtual headset with the virtual controllers
#   (`hmd on --with-driver`: settings snapshot, restored by `hmd off`). Its window is 1920 x 1080
#   so a caption cut out of it can be read (in 480 x 270 each eye had 180 x 150 pixels).
# - The "soak" phase starts the caption sample for E25 and always stops it on exit.
# - The "upgrade" phase stops the suite's ASTAROT while E26 runs its isolated copy in
#   records/suite/E26 (ground rule 4; HKCU installer keys are snapshotted and restored if an
#   installer runs), then restarts the suite's ASTAROT.
#
# Order: the cases that use the real headset first, then the virtual-headset ones, so each phase
# is set up once. Names pressed in the app are its Japanese UI (UI_LANGUAGE ja in the profile's
# check settings). From ASTAROT 0.7.0-beta.3 the settings open in a window of their own
# ("ASTAROTの設定", #1236): `app press` finds the settings' controls there, and the cases close
# it with its "設定を閉じる" button where they used to press "戻る". The reset (`app home`) closes
# it too after a case that stopped half-way.

[suite]
name = "astarot-e2e"
# After a case that failed or errored: back to the main page (stop a caption sample still
# sending, close the settings window or leave the settings page), so the next cases do not fail
# one after another.
reset = [["sergulath", "app", "home"]]
setup = [
    ["sergulath", "app", "stop"],
    ["sergulath", "app", "start", "--settings-dir", "records/suite/app", "--fresh"],
]
teardown = [
    ["sergulath", "app", "stop"],
    ["sergulath", "app", "start"],
]

[phase.virtual]
setup = [
    ["sergulath", "app", "stop"],
    ["sergulath", "app", "start", "--settings-dir", "records/suite/app-vr", "--fresh", "--set", "OVERLAY_VR_PANEL=true"],
    ["sergulath", "hmd", "on", "--with-driver", "--window", "0", "0", "1920", "1080"],
    ["sergulath", "steamvr", "wait", "--until", "tracking", "--timeout", "90"],
    ["sergulath", "controller", "connect", "--hand", "left"],
    ["sergulath", "controller", "connect", "--hand", "right"],
    ["sergulath", "controller", "dashboard", "close"],
]
teardown = [["sergulath", "hmd", "off"]]

# The VR View opened unattended (a settings snapshot and a SteamVR restart), closed again after.
[phase.vrview]
setup = [["sergulath", "view", "open"]]
teardown = [["sergulath", "view", "close"]]

# Caption sample kept active for the 30-minute soak (E25), always stopped on exit.
[phase.soak]
setup = [["sergulath", "caption", "sample", "start"]]
teardown = [["sergulath", "caption", "sample", "stop"]]

# Stops the suite's ASTAROT while E26 boots its isolated upgrade sandbox so overlay keys do not collide.
[phase.upgrade]
setup = [["sergulath", "app", "stop"]]
teardown = [["sergulath", "app", "start", "--settings-dir", "records/suite/app"]]

# ---- startup and prerequisites ----------------------------------------------------------------

[[case]]
id = "E01"
group = "startup"
title = "With SteamVR stopped, the commands end with exit code 3 and do not start it"
steps = [
    { run = ["sergulath", "steamvr", "stop"] },
    { run = ["sergulath", "overlay"], exit = [3] },
    { run = ["sergulath", "caption", "check"], exit = [3] },
    { run = ["sergulath", "watch", "--count", "1"], exit = [3] },
    { run = ["sergulath", "steamvr", "status", "--no-devices", "--format", "json"], exit = [1], json = { running = false } },
    { run = ["sergulath", "steamvr", "start"] },
    { run = ["sergulath", "steamvr", "wait", "--until", "connected", "--timeout", "90"] },
    { run = ["sergulath", "overlay", "--key", "ASTAROT0", "--format", "json"], json = { found = true }, wait = 15 },
]

[[case]]
id = "E02"
group = "startup"
title = "steamvr status reports the version and the headset and controllers"
steps = [
    { run = ["sergulath", "steamvr", "status", "--format", "json"], json = { running = true, version = { present = true }, devices = { present = true } } },
]

[[case]]
id = "E03"
group = "startup"
title = "With ASTAROT stopped, overlay finds nothing and exits with 1"
steps = [
    { run = ["sergulath", "app", "stop"] },
    { run = ["sergulath", "overlay"], exit = [1] },
    { run = ["sergulath", "app", "start", "--settings-dir", "records/suite/app"] },
    { run = ["sergulath", "overlay", "--key", "ASTAROT0", "--format", "json"], json = { found = true }, wait = 15 },
]

[[case]]
id = "E04"
group = "startup"
title = "The profile's overlay keys match the running version"
steps = [
    { run = ["sergulath", "profiles", "--format", "json"], json = { profile = "astarot", overlays = ["ASTAROT0", "ASTAROT1", "ASTAROT2", "ASTAROT3", "ASTAROT4"] } },
    # The two caption overlays exist (ASTAROT2 to 4 come with the VR UI, checked in E11).
    { run = ["sergulath", "overlay", "--key", "ASTAROT0", "--format", "json"], json = { found = true } },
    { run = ["sergulath", "overlay", "--key", "ASTAROT1", "--format", "json"], json = { found = true } },
    { run = ["sergulath", "overlay", "--legacy", "--format", "json"], exit = [1] },
]

# ---- caption overlays --------------------------------------------------------------------------

[[case]]
id = "E05"
group = "captions"
title = "After caption sample start, the one-line caption is shown, not transparent, and drawn"
steps = [
    { run = ["sergulath", "caption", "sample", "start"] },
    { run = ["sergulath", "caption", "check", "--format", "json"], json = { rendered = true }, wait = 3 },
    { run = ["sergulath", "caption", "sample", "stop"] },
]

[[case]]
id = "E06"
group = "captions"
title = "With --line multi, ASTAROT1 is shown"
steps = [
    { run = ["sergulath", "caption", "sample", "start", "--line", "multi"] },
    { run = ["sergulath", "caption", "check", "--line", "multi", "--format", "json"], json = { rendered = true }, wait = 3 },
    { run = ["sergulath", "caption", "sample", "stop"] },
]

[[case]]
id = "E07"
group = "captions"
title = "After the sample stops and the display time and fade pass, the alpha is back at 0"
steps = [
    { run = ["sergulath", "caption", "sample", "start"] },
    { run = ["sergulath", "caption", "sample", "stop"], wait = 3 },
    # The profile's defaults: shown 5 s, faded over 2 s.
    { run = ["sergulath", "watch", "--count", "1", "--overlay", "ASTAROT0", "--format", "json"], json = { source = "overlay", key = "ASTAROT0", alpha = 0.0 }, wait = 12 },
]

[[case]]
id = "E10"
group = "captions"
title = "Turning the caption overlays off removes the overlays"
steps = [
    { run = ["sergulath", "app", "press", "クイック設定", "--prefix"] },
    { run = ["sergulath", "app", "press", "字幕オーバーレイ", "--prefix"] },
    { run = ["sergulath", "overlay", "--key", "ASTAROT0", "--format", "json"], exit = [1], json = { found = false }, wait = 3 },
    { run = ["sergulath", "overlay", "--key", "ASTAROT1", "--format", "json"], exit = [1], json = { found = false } },
    # Back on.
    { run = ["sergulath", "app", "press", "字幕オーバーレイ", "--prefix"] },
    { run = ["sergulath", "overlay", "--key", "ASTAROT0", "--format", "json"], json = { found = true }, wait = 3 },
]

# ---- VR UI (with the #966 regression) ----------------------------------------------------------

[[case]]
id = "E11"
group = "vr-ui"
title = "Turning the VR UI on registers the launcher (ASTAROT3) and shows it"
steps = [
    { run = ["sergulath", "app", "press", "設定を開く", "実験的機能", "VR UIを表示する", "設定を閉じる"] },
    { run = ["sergulath", "overlay", "--key", "ASTAROT3", "--format", "json"], json = { found = true, visible = true }, wait = 4 },
    { run = ["sergulath", "overlay", "--key", "ASTAROT2", "--format", "json"], json = { found = true } },
    { run = ["sergulath", "overlay", "--key", "ASTAROT4", "--format", "json"], json = { found = true } },
]

[[case]]
id = "E13"
group = "vr-ui"
title = "With the headset on a desk in standby, the launcher's alpha is 0"
steps = [
    { run = ["sergulath", "overlay", "--key", "ASTAROT3", "--format", "json"], json = { visible = true, alpha = 0.0 } },
]
note = "As designed (native/vr-overlay, update_launcher_visibility): the launcher shows only while the head pose and the left hand's pose say the wrist is looked at; a headset without a pose gives neither (#966)."

[[case]]
id = "E15"
group = "vr-ui"
title = "Turning the VR UI off hides ASTAROT2 and ASTAROT3"
steps = [
    { run = ["sergulath", "app", "press", "設定を開く", "実験的機能", "VR UIを表示する", "設定を閉じる"] },
    { run = ["sergulath", "overlay", "--key", "ASTAROT3", "--format", "json"], json = { visible = false }, wait = 4 },
    { run = ["sergulath", "overlay", "--key", "ASTAROT2", "--format", "json"], json = { visible = false } },
]

# ---- watch and stability -------------------------------------------------------------------------

[[case]]
id = "E18"
group = "watch"
title = "A 20-minute watch records the headset's activity (active to standby) and the controllers"
slow = true
steps = [
    { run = ["sergulath", "watch", "--count", "21", "--interval", "60", "--csv", "records/suite/E18.csv", "--format", "json"], json = { source = "steamvr", device_class = "hmd", activity = { present = true } }, timeout = 1500 },
]
note = "Unattended, the headset is not worn when it starts, so the record shows standby (or idle) throughout rather than the change from active; the change needs someone to put it on at the start."

[[case]]
id = "E20"
group = "watch"
title = "watch --frame reports whether the Frame shows its outside-the-play-space camera screen"
steps = [
    { run = ["sergulath", "watch", "--count", "1", "--frame", "--format", "json"], json = { source = "frame", key = "XRService-CameraOverlay", found = true } },
]

[[case]]
id = "E21"
group = "watch"
title = "After a long idle and standby, caption check passes"
slow = true
steps = [
    # SteamVR turns the screens off after power.turnOffScreensTimeout (300 s here).
    { run = ["sergulath", "steamvr", "status", "--format", "json"], json = { running = true }, wait = 420, timeout = 600 },
    { run = ["sergulath", "caption", "sample", "start"] },
    { run = ["sergulath", "caption", "check", "--format", "json"], json = { rendered = true }, wait = 3 },
    { run = ["sergulath", "caption", "sample", "stop"] },
]

# ---- view and the Frame side ---------------------------------------------------------------------

[[case]]
id = "E23"
group = "frame"
title = "frame overlays shows the Frame's system.systemui"
steps = [
    { run = ["sergulath", "frame", "overlays", "--format", "json"], json = { key = "system.systemui", found = true } },
]
note = "Whether the headset is outside its play space is not under the suite's control; the case checks that the Frame's own overlays are read, and records whether system.systemui is shown."

# ---- the virtual headset phase (needs no person) ---------------------------------------------------

[[case]]
id = "E08"
group = "captions"
phase = "virtual"
title = "overlay --placement: the one-line caption follows the head, the multi-line one the hand"
steps = [
    { run = ["sergulath", "overlay", "--placement", "--key", "ASTAROT0", "--format", "json"], json = { "placement.device" = "hmd", "placement.device_pose_valid" = true } },
    { run = ["sergulath", "overlay", "--placement", "--key", "ASTAROT1", "--format", "json"], json = { "placement.device" = "controller/left", "placement.device_pose_valid" = true } },
]
note = "Runs on the virtual headset with the virtual left hand: a Steam Frame's controllers sleep on a desk, and the hand-held overlay then waits at the origin with no hand to follow."

[[case]]
id = "E09"
group = "captions"
phase = "virtual"
title = "The sample caption is drawn: cut out of the headset's image, and its pixels where SteamVR hands them out"
steps = [
    { run = ["sergulath", "caption", "sample", "start"] },
    { run = ["sergulath", "view", "save", "--headset", "--overlay", "ASTAROT0", "--out", "records/suite/E09/ASTAROT0-headset.png", "--format", "json"], json = { visible = true, blank = false, inside = { gt = 0.9 } }, wait = 3 },
    { run = ["sergulath", "overlay", "--key", "ASTAROT0", "--save", "records/suite/E09", "--format", "json"], exit = [0, 1] },
    { run = ["sergulath", "caption", "sample", "stop"] },
]
note = "The headset's image is the route that works for every build (stage 4 of the gap plan): 0.6 develop builds hand the caption overlays to SteamVR as GPU textures, whose pixels another process cannot read (OverlayError_InvalidTexture, also through GetOverlayTexture), and a real headset in standby hands out no overlay's pixels. `overlay --save` stays as a record where it works. Runs on the virtual headset, which looks straight ahead where the one-line caption is."

[[case]]
id = "E12"
group = "vr-ui"
phase = "virtual"
title = "Worn (the virtual headset looking at the wrist), the launcher's alpha goes up"
steps = [
    { run = ["sergulath", "controller", "pose", "--hand", "left", "--show", "ASTAROT3"] },
    { run = ["sergulath", "overlay", "--key", "ASTAROT3", "--format", "json"], json = { visible = true, alpha = 1.0 }, wait = 6 },
]
note = "The list marks this case as needing someone to wear the headset; the virtual headset stands in for that."

[[case]]
id = "E16"
group = "vr-ui"
phase = "virtual"
title = "The VR panel (ASTAROT2) opens and closes from the launcher's log button"
steps = [
    { run = ["sergulath", "overlay", "--key", "ASTAROT2", "--format", "json"], json = { visible = false } },
    { run = ["sergulath", "overlay", "press", "--overlay", "ASTAROT3", "--button", "log", "--format", "json"], json = { hit = true } },
    { run = ["sergulath", "overlay", "--key", "ASTAROT2", "--format", "json"], json = { visible = true }, wait = 2 },
    { run = ["sergulath", "overlay", "press", "--overlay", "ASTAROT3", "--button", "log", "--format", "json"], json = { hit = true } },
    { run = ["sergulath", "overlay", "--key", "ASTAROT2", "--format", "json"], json = { visible = false }, wait = 2 },
]
note = "The list says opening it needs a person; the virtual controllers press the launcher now."

[[case]]
id = "E17"
group = "popup"
phase = "virtual"
title = "The popup (ASTAROT4) shows from the launcher's language button and closes again"
steps = [
    { run = ["sergulath", "overlay", "press", "--overlay", "ASTAROT3", "--button", "language", "--format", "json"], json = { hit = true } },
    { run = ["sergulath", "overlay", "--key", "ASTAROT4", "--format", "json"], json = { visible = true }, wait = 2 },
    { run = ["sergulath", "overlay", "press", "--overlay", "ASTAROT3", "--button", "language", "--format", "json"], json = { hit = true } },
    { run = ["sergulath", "overlay", "--key", "ASTAROT4", "--format", "json"], json = { visible = false }, wait = 2 },
]
note = "The list says a notification shows ASTAROT4 and it goes away with time. In ASTAROT 0.6, ASTAROT4 is the VR UI's popup window (language, inputs and outputs, VR settings) opened from the launcher, and it does not time out; this case checks that instead until the list is settled."

[[case]]
id = "E14"
group = "vr-ui"
phase = "virtual"
title = "After resetting its position, the launcher is back on the left wrist"
steps = [
    { run = ["sergulath", "app", "press", "設定を開く", "実験的機能", "ランチャーの位置と大きさを初期に戻す", "設定を閉じる"] },
    { run = ["sergulath", "overlay", "--placement", "--key", "ASTAROT3", "--format", "json"], json = { "placement.device" = "controller/left", "placement.offset_distance_m" = { lt = 0.3 } }, wait = 3 },
]

# ---- the VR View --------------------------------------------------------------------------------

[[case]]
id = "E22"
group = "view"
phase = "vrview"
title = "view save: the VR View is blank (exit 1) while the headset is not tracking"
steps = [
    { run = ["sergulath", "view", "save", "--out", "records/suite/e22-vr-view.png", "--format", "json"], exit = [1], json = { blank = true }, wait = 5 },
]
note = "The other half of the list's case, captions in the VR View while tracking, needs the headset worn: the VR View shows the mirror only while the real headset tracks, and under the virtual headset it stays black (the null driver gives it no mirror). Captions under the virtual headset are read from its own window instead (E09, `view save --headset`)."

# ---- cases the suite cannot run --------------------------------------------------------------------

[[case]]
id = "E19"
group = "watch"
title = "From tracking lost on a desk, lifting the headset brings tracking back"
manual = "someone has to lift the headset; the virtual headset never loses tracking, so it cannot stand in"

[[case]]
id = "E24"
group = "cross-version"
title = "overlay finds a 0.5.x ASTAROT's old keys (VRCT0 to VRCT4)"
unsupported = "needs a 0.5.x ASTAROT installed in place of 0.6 (optional in the list); `overlay --legacy` is there for it"

# ---- long-running stability and upgrade path -------------------------------------------------------

[[case]]
id = "E25"
group = "stability"
phase = "soak"
title = "30-minute soak: ASTAROT stays alive, memory stays bounded, and the caption overlay stays shown"
slow = true
steps = [
    { run = ["sergulath", "soak", "--duration", "1800", "--interval", "60", "--warmup", "120", "--max-growth-mb", "100", "--max-slope-mb-per-hour", "120", "--overlay", "ASTAROT0", "--min-alpha", "0.01", "--csv", "records/suite/E25.csv", "--format", "json"], json = { source = "summary", ok = true, alive = true, memory_ok = true, overlay_ok = true }, wait = 3, timeout = 2400 },
]
note = "Runs with the app's own caption sample active (phase soak) for 30 minutes (31 samples, 60 s apart). Checks that the initial PID never exits, post-warmup process-tree private memory stays within 100 MiB net growth and 120 MiB/h trend, and ASTAROT0 stays found, visible and non-transparent (alpha >= 0.01). Overlay pixels are not read here because a real headset enters standby after 5 minutes and GPU-texture builds return OverlayError_InvalidTexture."

[[case]]
id = "E26"
group = "upgrade"
phase = "upgrade"
title = "Upgrade from 0.6.0 to beta (or local package) keeps settings and models and starts cleanly"
steps = [
    { run = ["sergulath", "upgrade", "check", "--from-version", "0.6.0", "--channel", "beta", "--work-dir", "records/suite/E26", "--cache-dir", "records/suite/cache", "--check-overlay", "ASTAROT0", "--format", "json"], json = { source = "upgrade", ok = true, settings_preserved = true, models_preserved = true, launched_ok = true }, unsupported_when = { source = "upgrade", status = "unsupported" }, timeout = 900 },
]
note = "Stages an isolated 0.6.0 copy in records/suite/E26/install (never touches the user's installed ASTAROT or settings; ground rule 4), seeds non-default settings and synthetic model files under downloaded_models/, then updates via the beta channel (beta/latest.json). Handles the 0.7.0 rename from vrct-vox.exe to astarot.exe across the update. While no beta newer than 0.6.0 is published, set SERGULATH_UPGRADE_TO (and optionally SERGULATH_UPGRADE_FROM) to a local ASTAROT.zip / VRCT-VOX.zip, unpacked folder or setup.exe to run this case; otherwise it reports unsupported."
