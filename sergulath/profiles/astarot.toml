# ASTAROT (kein5/astarot). Facts the tools need about the app, per app version.

name = "ASTAROT"

[app]
process = "vrct-vox.exe"
exe = "%LOCALAPPDATA%\\ASTAROT\\vrct-vox.exe"  # the default install folder (0.5.1 and later)
main_window_title = "ASTAROT"

# Which overlay shows which caption.
[captions]
one = "ASTAROT0"
multi = "ASTAROT1"

# Accessible names of the buttons on the way to the caption sample, in the app's Japanese UI
# (locales/ja.yml). The sample is sent once a second while the settings page stays open.
[ui.ja]
open_settings = "設定を開く"                     # main page, gear button
page = "字幕とVR"                                # settings rail
details_prefix = "詳細設定"                      # the page's "more settings" fold (name starts with this)
tab_one = "一行"
tab_multi = "複数行"
sample_start = "サンプルの文を字幕オーバーレイに送る"
sample_stop = "送信を停止"
back = "戻る"

# Overlay keys, in the app's order (native/vr-overlay, Surface::ALL).
# 0.6 and later: ASTAROT0..4. Up to 0.5.x the keys were VRCT0..4.
[overlays]
ASTAROT0 = "caption, one line (head)"
ASTAROT1 = "caption, multiple lines (hand)"
ASTAROT2 = "VR panel"
ASTAROT3 = "launcher"
ASTAROT4 = "popup"

[legacy_overlays]
VRCT0 = "caption, one line (head), up to 0.5.x"
VRCT1 = "caption, multiple lines (hand), up to 0.5.x"
VRCT2 = "VR panel, up to 0.5.x"
VRCT3 = "launcher, up to 0.5.x"
VRCT4 = "popup, up to 0.5.x"
